<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" width="960" height="425" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .s  { font-size: 12px; fill: #4B5563; text-anchor: middle; }
      .ph { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .lbl{ font-size: 12px; font-weight: 600; fill: #6B7280; }
      .a  { stroke: #6B7280; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .l  { stroke: #6B7280; stroke-width: 1.8; fill: none; }
      .c  { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.6; }
      .u  { fill: #F5F3FF; stroke: #8B5CF6; stroke-width: 1.6; }
    </style>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="958" height="423" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- phase 1 label -->
  <text x="40" y="38" class="ph" fill="#2563EB">1 · COLLECT EXPERIENCE</text>

  <!-- row 1: collect -->
  <rect x="40"  y="52" width="160" height="78" rx="10" class="c"/>
  <text x="120" y="84"  class="t">Observe</text>
  <text x="120" y="106" class="s">state s (8 values)</text>

  <rect x="220" y="52" width="160" height="78" rx="10" class="c"/>
  <text x="300" y="84"  class="t">Act</text>
  <text x="300" y="106" class="s">sample a ~ N(μ, σ)</text>

  <rect x="400" y="52" width="160" height="78" rx="10" class="c"/>
  <text x="480" y="84"  class="t">Step env</text>
  <text x="480" y="106" class="s">clamp a to [-1, 1]</text>

  <rect x="580" y="52" width="160" height="78" rx="10" class="c"/>
  <text x="660" y="84"  class="t">Score</text>
  <text x="660" y="106" class="s">reward + crash check</text>

  <rect x="760" y="52" width="160" height="78" rx="10" class="c"/>
  <text x="840" y="84"  class="t">Store</text>
  <text x="840" y="106" class="s">(s, a, r, s′, log π)</text>

  <line x1="200" y1="91" x2="218" y2="91" class="a"/>
  <line x1="380" y1="91" x2="398" y2="91" class="a"/>
  <line x1="560" y1="91" x2="578" y2="91" class="a"/>
  <line x1="740" y1="91" x2="758" y2="91" class="a"/>

  <!-- decision -->
  <line x1="840" y1="130" x2="840" y2="163" class="a"/>
  <polygon points="840,165 916,210 840,255 764,210" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="840" y="206" class="t" style="font-size:14px">Buffer full?</text>
  <text x="840" y="224" class="s">2048 steps</text>

  <!-- No: loop back to Observe -->
  <polyline points="764,210 120,210 120,132" class="a"/>
  <text x="725" y="202" class="lbl">No</text>

  <!-- Yes: go to update -->
  <line x1="840" y1="255" x2="840" y2="288" class="a"/>
  <text x="850" y="276" class="lbl">Yes</text>

  <!-- row 2: update (right to left) -->
  <rect x="760" y="290" width="160" height="78" rx="10" class="u"/>
  <text x="840" y="318" class="t">Evaluate</text>
  <text x="840" y="338" class="s">critic V(s), V(s′)</text>
  <text x="840" y="355" class="s">for the whole buffer</text>

  <rect x="580" y="290" width="160" height="78" rx="10" class="u"/>
  <text x="660" y="318" class="t">Advantages</text>
  <text x="660" y="338" class="s">GAE (γ = 0.99, λ = 0.95)</text>
  <text x="660" y="355" class="s">then normalise</text>

  <!-- repeated network updates -->
  <rect x="208" y="278" width="356" height="132" rx="14" fill="none" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="386" y="400" class="s" style="font-weight:600; fill:#6D28D9">repeat: 10 epochs × minibatches of 64</text>

  <rect x="400" y="290" width="160" height="78" rx="10" class="u"/>
  <text x="480" y="318" class="t">Update actor</text>
  <text x="480" y="338" class="s">clipped PPO loss</text>
  <text x="480" y="355" class="s">+ entropy · Adam step</text>

  <rect x="220" y="290" width="160" height="78" rx="10" class="u"/>
  <text x="300" y="318" class="t">Update critic</text>
  <text x="300" y="338" class="s">MSE value loss</text>
  <text x="300" y="355" class="s">Adam step · grad clip 0.5</text>

  <rect x="40" y="290" width="160" height="78" rx="10" class="u"/>
  <text x="120" y="318" class="t">Reset</text>
  <text x="120" y="338" class="s">clear the buffer,</text>
  <text x="120" y="355" class="s">new rollout</text>

  <line x1="760" y1="329" x2="742" y2="329" class="a"/>
  <line x1="580" y1="329" x2="562" y2="329" class="a"/>
  <line x1="400" y1="329" x2="382" y2="329" class="a"/>
  <line x1="220" y1="329" x2="202" y2="329" class="a"/>

  <!-- Reset joins the loop back to Observe -->
  <line x1="120" y1="290" x2="120" y2="212" class="l"/>
  <circle cx="120" cy="210" r="4" fill="#6B7280"/>

  <!-- phase 2 label -->
  <text x="600" y="400" class="ph" fill="#7C3AED">2 · UPDATE NETWORKS (actor + critic)</text>
</svg>
